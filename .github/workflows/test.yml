name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check the page scripts
        run: for f in engine.js app.js motion.js data.js real-data.js; do node --check "$f"; done
      - name: Engine tests
        run: node --test "tests/*.test.js"
