<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team inbox · Tickmark Hybrid</title>
<meta name="description" content="The answering team's inbox for Tickmark Hybrid: checks from other teams arrive live through Firestore, replies are drafted on this device.">
<style>
  :root { --bg: #0e0e0d; --sheet: #161514; --raise: #1e1d1b; --edge: #2e2b27; --rule: #24221f; --ink: #efe7d8; --muted: #a49b8d; --gold: #d2a965; --cream: #f4e8d2; --ok: #9fd0b0; --warn: #e8c27e; --neg: #f0a597; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Manrope", system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 17px; } header .who { color: var(--muted); font-size: 13px; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--sheet); border: 1px solid var(--edge); padding: 16px; }
  .sl { margin: 0 0 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .c-s { color: var(--muted); font-size: 13px; margin: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--edge); padding: 8px 10px; font: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 0; padding: 9px 16px; background: var(--gold); color: #15130f; }
  button.sec { background: transparent; color: var(--ink); border: 1px solid #4a4539; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .list { display: grid; gap: 8px; }
  .item { display: block; width: 100%; text-align: left; background: var(--raise); border: 1px solid var(--edge); color: var(--ink); padding: 10px 12px; font-weight: 400; }
  .item[aria-current="true"] { border-color: var(--gold); }
  .item b { display: block; font-size: 14px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border: 1px solid currentColor; border-radius: 99px; margin-right: 6px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .neg { color: var(--neg); }
  .q { font-size: 16px; margin: 6px 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--rule); vertical-align: top; } th { color: var(--muted); font-weight: 600; width: 42%; }
  .busy { color: var(--gold); font-size: 14px; margin: 8px 0 0; }
  .empty { color: var(--muted); padding: 20px 0; }
  code { background: var(--raise); padding: 1px 6px; }
</style>
</head>
<body>
<header>
  <h1>Team inbox <span class="c-s">· Tickmark Hybrid</span></h1>
  <span class="who" id="who">Not joined</span>
</header>
<main>
  <section class="panel" aria-label="Join and inbox">
    <div id="joinBox">
      <p class="sl">Join a room</p>
      <p class="c-s">A room is one demo session. The servicing analyst’s case page shows its code.</p>
      <label for="room">Room code</label><input id="room" autocomplete="off" spellcheck="false">
      <label for="team">Your team</label>
      <select id="team"><option value="approvals">Servicing Approvals</option><option value="payments">Payments</option><option value="legal">Lawyer’s office</option></select>
      <label for="name">Your name</label><input id="name" value="Daniel Roy" maxlength="60">
      <div class="row"><button id="joinBtn">Join</button></div>
      <p class="c-s" id="joinMsg" role="status"></p>
    </div>
    <div id="inboxBox" hidden>
      <p class="sl">Checks sent to your team</p>
      <div class="list" id="list" aria-live="polite"></div>
    </div>
  </section>
  <section class="panel" id="detail" aria-label="Check">
    <p class="empty">Open a check to answer it. New checks appear here live.</p>
  </section>
</main>
<script>self.TICKMARK_APP_NAME = 'team-inbox';</script>
<script type="module">
  import { currentRoom, join, watchInbox, reply, TEAMS, fieldsFor } from './ai/checks.js';
  import { stream, deviceStatus, PolicyBlocked } from './ai/hybrid.js';

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const params = new URLSearchParams(location.hash.slice(1));
  $('room').value = params.get('room') || currentRoom();
  if (params.get('team')) $('team').value = params.get('team');
  if ($('team').value === 'payments') $('name').value = 'Priya Nair';

  let me = null, checks = [], openId = null, stop = null;
  const drafts = new Map(); // checkId -> { text, ranOn, busy }

  $('team').onchange = () => { $('name').value = { approvals: 'Daniel Roy', payments: 'Priya Nair', legal: 'R. Okafor' }[$('team').value]; };
  $('joinBtn').onclick = async () => {
    const room = $('room').value.trim(), team = $('team').value, name = $('name').value.trim();
    $('joinMsg').textContent = 'Joining…';
    try {
      await join(room, team, name, 'web');
      me = { room, team, name };
      $('who').textContent = `${name} · ${TEAMS[team]} · room ${room}`;
      $('joinBox').hidden = true; $('inboxBox').hidden = false;
      if (stop) stop();
      stop = watchInbox(room, team, (list, err) => {
        if (err) { $('list').innerHTML = `<p class="c-s neg">Live updates stopped: ${esc(err.message)}</p>`; return; }
        checks = list; drawList(); if (openId) drawDetail();
      });
    } catch (e) { $('joinMsg').textContent = 'Could not join: ' + e.message; }
  };

  const state = (c) => c.status === 'open' ? ['warn', 'Waiting on you'] : c.status === 'answered' ? ['ok', 'Answered'] : c.status === 'accepted' ? ['ok', 'Accepted'] : ['neg', 'Sent back'];
  function drawList() {
    $('list').innerHTML = checks.length ? checks.map((c) => `<button class="item" data-id="${c.id}" aria-current="${c.id === openId}">
      <span class="pill ${state(c)[0]}">${state(c)[1]}</span><b>${esc(c.caseTitle)}</b><span class="c-s">${esc(c.caseId)} · from ${esc(TEAMS[c.fromTeam] || c.fromTeam)}</span></button>`).join('')
      : '<p class="empty">Nothing yet. When the servicing analyst sends a check, it appears here within a second.</p>';
  }
  $('list').onclick = (e) => { const b = e.target.closest('[data-id]'); if (!b) return; openId = b.dataset.id; drawList(); drawDetail(); };

  function drawDetail() {
    const c = checks.find((x) => x.id === openId);
    if (!c) { $('detail').innerHTML = '<p class="empty">Open a check to answer it.</p>'; return; }
    const d = drafts.get(c.id) || { text: '' };
    const fields = fieldsFor(c.requested);
    const answered = c.status === 'answered' || c.status === 'accepted';
    $('detail').innerHTML = `<p class="sl">${esc(c.caseId)} · from ${esc(TEAMS[c.fromTeam] || c.fromTeam)} · <span class="${state(c)[0]}">${state(c)[1]}</span></p>
      <p class="q">${esc(c.question)}</p>
      ${c.whyItMatters ? `<p class="c-s">${esc(c.whyItMatters)}</p>` : ''}
      <p class="sl" style="margin-top:14px">What the case shows</p>
      <table><tbody>${Object.entries(c.expected || {}).map(([k, v]) => `<tr><th>${esc(k.replace(/_/g, ' '))}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
      <p class="c-s" style="margin-top:8px">Shared redacted: no names or account numbers left the analyst’s device.</p>
      ${answered ? `<p class="sl" style="margin-top:16px">Your reply</p><p>${esc(c.reply.text)}</p>${Object.entries(c.reply.facts || {}).map(([k, v]) => `<p class="c-s">${esc(k)}: ${esc(v)}</p>`).join('')}` : `
      <p class="sl" style="margin-top:16px">Your answer</p>
      ${fields.map((f) => `<label for="f-${f.key}">${esc(f.label)}</label><input id="f-${f.key}" type="${f.type}" data-key="${f.key}" value="${esc((d.fields || {})[f.key] || '')}">`).join('')}
      <label for="replyText">Reply</label><textarea id="replyText" rows="4">${esc(d.text)}</textarea>
      ${d.busy ? `<p class="busy" role="status">Drafting${d.ranOn === 'on_device' ? ' on this device' : ''}…</p>` : d.ranOn ? `<p class="c-s"><span class="pill ${d.ranOn === 'on_device' ? 'ok' : 'warn'}">${d.ranOn === 'on_device' ? 'Drafted on this device' : 'Drafted in the cloud'}</span></p>` : ''}
      <div class="row"><button class="sec" id="draftBtn" ${d.busy ? 'disabled' : ''}>Draft the reply on this device</button><button id="sendBtn">Send reply</button></div>
      <p class="c-s" id="sendMsg" role="status"></p>`}`;
    if (answered) return;
    $('replyText').oninput = (e) => { d.text = e.target.value; drafts.set(c.id, d); };
    // keep typed decision values across redraws (drafting redraws the panel)
    document.querySelectorAll('#detail [data-key]').forEach((i) => { i.oninput = () => { d.fields = { ...(d.fields || {}), [i.dataset.key]: i.value }; drafts.set(c.id, d); }; });
    $('draftBtn').onclick = () => draft(c);
    $('sendBtn').onclick = () => send(c);
  }

  async function draft(c) {
    const d = drafts.get(c.id) || { text: '' };
    document.querySelectorAll('#detail [data-key]').forEach((i) => { d.fields = { ...(d.fields || {}), [i.dataset.key]: i.value }; });
    d.busy = true; d.text = ''; drafts.set(c.id, d); drawDetail();
    const values = [...document.querySelectorAll('[data-key]')].map((i) => `${i.dataset.key}: ${i.value || '(not filled in)'}`).join('\n');
    try {
      const r = await stream({ task: 'Draft reply to a check', dataClass: 'redacted_text',
        prompt: `You answer a question from another team at a bank, as ${me.name} of ${TEAMS[me.team]}. Write 2 short sentences that answer it directly, using the decision values below. No greeting. Keep tokens such as [NAME_1] as they are.\n\nQuestion: ${c.question}\nFacts on the case: ${JSON.stringify(c.expected)}\nDecision values:\n${values}`,
        onText: (t, where) => { d.text = t; d.ranOn = where || d.ranOn; const ta = $('replyText'); if (ta) ta.value = t; } });
      d.text = r.text.trim(); d.ranOn = r.ranOn;
    } catch (e) { d.text = ''; $('sendMsg') && ($('sendMsg').textContent = e instanceof PolicyBlocked ? e.message : 'Could not draft: ' + e.message); }
    d.busy = false; drafts.set(c.id, d); drawDetail();
  }

  async function send(c) {
    const d = drafts.get(c.id) || {};
    const text = $('replyText').value.trim();
    const facts = {};
    document.querySelectorAll('[data-key]').forEach((i) => { if (i.value) facts[i.dataset.key] = i.value; });
    if (text.length < 10) { $('sendMsg').textContent = 'Write the reply (at least 10 characters).'; return; }
    $('sendBtn').disabled = true; $('sendMsg').textContent = 'Sending…';
    try { await reply(me.room, c.id, { text, facts, byName: me.name, ranOn: d.ranOn || 'none' }); $('sendMsg').textContent = 'Sent. The analyst sees it now.'; }
    catch (e) { $('sendMsg').textContent = 'Not sent: ' + e.message; $('sendBtn').disabled = false; }
  }

  deviceStatus(false).then((s) => { if (s !== 'available') $('who').textContent += ' · no on-device model here (drafts use redacted text in the cloud)'; });
</script>
</body>
</html>
